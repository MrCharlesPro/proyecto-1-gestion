name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (umbral 70%)
        run: >
          npx jest --coverage --coverageReporters=text --coverageReporters=text-summary
          --coverageThreshold='{"global":{"statements":70,"branches":70,"functions":70,"lines":70}}'

      - name: Resumen de cobertura en GitHub
        if: always()
        run: echo "Pruebas y cobertura ejecutadas. Revisa el log del paso anterior." >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub (PAT)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push (latest + SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

  deploy:
    name: Desplegar en AWS EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            docker stop webapp || true
            docker rm webapp || true
            docker run -d --name webapp --restart unless-stopped \
              -p 80:80 -p 6061:6061 \
              -v webapp-data:/app/data \
              ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            docker image prune -f
